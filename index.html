<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="content" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="../styles.css" rel="stylesheet" />
  </head>
  <body>
     <div class="event_container">
      <div class="event_col event_col_info">
        <span class="event_date">{{event.start_date}}</span>
      </div>

      <div class="event_col event_col_info">
        <span class="event_title">{{event.title}}</span><span class="event_time"> {{event.start_time}}-{{event.end_time}} </span><span class="event_location">{% if event._event_online == '1' %}💻 Online {% else %}📍 {{event.location}}{% endif %}</span>
      </div>

      <div class="event_col event_col_cta">
        <a class="event_button" href="{{event._event_link}}" target="_blank">Register</a>
      </div>
    </div>
  </body>
</html>
